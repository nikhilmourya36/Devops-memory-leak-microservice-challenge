name: Build and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Avoid running again when this workflow commits the manifest.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-memory-leak-microservice-challenge:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-memory-leak-microservice-challenge:latest

      - name: Update Kubernetes image tag
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-memory-leak-microservice-challenge:v1:${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")
          content = path.read_text()

          pattern = r"(?m)^(\s*image:\s*).+$"
          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + os.environ["IMAGE"],
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not find the deployment image field")

          path.write_text(updated)
          PY

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update memory-leak-service image"
            git push
          fi
